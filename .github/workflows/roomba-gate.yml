# roomba-gate - blockt, was ein Werkzeug abschliessend entscheiden kann.
# Diese Checks ersetzen die frueheren Katalog-Jobs `security-footguns` und
# `dead-code` (lokale Variablen/Imports). Was hier gruen ist, braucht keinen Agentenlauf.
#
# Ablage: .github/workflows/roomba-gate.yml
name: roomba-gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  r-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint
      - name: lintr object_usage (blockend)
        run: |
          Rscript -e 'l <- lintr::lint_package(linters = list(lintr::object_usage_linter()))
                      print(l)
                      if (length(l)) quit(status = 1)'
      - name: lintr unused_import (Bericht, nicht blockend)
        continue-on-error: true
        run: |
          Rscript -e 'print(lintr::lint_package(linters = list(lintr::unused_import_linter())))'
